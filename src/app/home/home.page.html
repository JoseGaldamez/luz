<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Luz Application
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div id="container">

    <ion-row>
      <ion-col>
        <ion-icon *ngIf="isActive" name="radio-button-on-outline" size="large"></ion-icon>
        <ion-icon *ngIf="!isActive" name="radio-button-off-outline" size="large"></ion-icon>
        <h2>Enciende/Apaga la Luz</h2>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <ion-toggle (ionChange)="toggleLuz()"></ion-toggle>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <p *ngIf="isActive">Luz Encendida</p>
        <p *ngIf="!isActive">Luz Apagada</p>
      </ion-col>
    </ion-row>

  </div>
</ion-content>
